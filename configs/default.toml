[project]
random_seed = 2026

[paths]
raw_dir = "data/raw"
interim_dir = "data/interim"
processed_dir = "data/processed"
artifact_dir = "artifacts"
output_dir = "outputs"

[nafirs]
package_api = "https://data-api.ssen.co.uk/api/3/action/package_show?id=nafirs-lv-faults"
sepd_resource_id = "743effda-bbff-4930-bdba-40eb63f97f65"
shepd_resource_id = "932fbadb-5e87-4bb7-bf5c-c8b75c2f3cf2"
timezone = "Europe/London"

[substations]
package_api = "https://data-api.ssen.co.uk/api/3/action/package_show?id=ssen-substation-data"
csv_resource_id = "336d9720-353c-49d3-8415-11e1cf4a85b9"
source_crs = "EPSG:27700"
target_crs = "EPSG:4326"

[weather]
archive_api = "https://archive-api.open-meteo.com/v1/archive"
forecast_api = "https://api.open-meteo.com/v1/forecast"
timezone = "UTC"
variables = [
  "temperature_2m",
  "relative_humidity_2m",
  "dew_point_2m",
  "precipitation",
  "rain",
  "snowfall",
  "surface_pressure",
  "wind_speed_10m",
  "wind_direction_10m",
  "wind_gusts_10m",
  "soil_moisture_0_to_7cm",
]

# These transparent regional anchors are fallbacks. The normal pipeline derives
# district-level centroids from SSEN's official substation-location dataset.
[[weather.locations]]
location_id = "sepd_west"
network = "SEPD"
latitude = 51.2665
longitude = -1.0870
radius_km = 6

[[weather.locations]]
location_id = "sepd_central"
network = "SEPD"
latitude = 51.4543
longitude = -0.9781
radius_km = 6

[[weather.locations]]
location_id = "sepd_coast"
network = "SEPD"
latitude = 50.8198
longitude = -1.0880
radius_km = 6

[[weather.locations]]
location_id = "shepd_north"
network = "SHEPD"
latitude = 57.4778
longitude = -4.2247
radius_km = 6

[[weather.locations]]
location_id = "shepd_east"
network = "SHEPD"
latitude = 57.1497
longitude = -2.0943
radius_km = 6

[[weather.locations]]
location_id = "shepd_islands"
network = "SHEPD"
latitude = 58.9847
longitude = -2.9587
radius_km = 6

[features]
hourly_history_days = 730
five_minute_history_days = 120
negative_to_positive_ratio = 5
day_max_positive_per_district_horizon = 100
hour_max_positive_per_district_horizon = 50
minimum_negative_per_district_horizon = 100
day_ahead_horizons_hours = [1, 6, 12, 24, 36, 48]
hour_ahead_horizons_minutes = [5, 15, 30, 60, 180, 360]

[model]
event_threshold = 0.001
test_fraction = 0.2
classifier_max_iter = 150
regressor_max_iter = 180
learning_rate = 0.06
max_leaf_nodes = 31
min_samples_leaf = 20

[phase1]
training_start = "2025-01-01T00:00:00Z"
training_end = "2025-08-31T23:45:00Z"
test_start = "2025-09-01T00:00:00Z"
test_end = "2025-11-30T23:45:00Z"
eaglei_url = "https://ndownloader.figshare.com/files/62164877"
eaglei_md5 = "cd2feb1282a42fb048cb6885398bc1cc"
mcc_url = "https://ndownloader.figshare.com/files/42547708"
mcc_md5 = "7e30d47d44cae46b3342cdabf7c84b7f"
gazetteer_url = "https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2025_Gazetteer/2025_Gaz_counties_national.zip"
historical_weather_api = "https://archive-api.open-meteo.com/v1/archive"
single_runs_api = "https://single-runs-api.open-meteo.com/v1/forecast"
weather_model = "ecmwf_ifs"
forecast_availability_lag_hours = 6
event_threshold = 0.001
task_a_issue_hour_utc = 6
weather_variables = [
  "temperature_2m",
  "relative_humidity_2m",
  "precipitation",
  "surface_pressure",
  "wind_speed_10m",
  "wind_gusts_10m",
]

